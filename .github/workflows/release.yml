name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release Linux arm64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Resolve release tag
        id: meta
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build linux arm64 package
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: |
          set -eux
          go build -trimpath -ldflags="-s -w" -o comfyui-manager-linux-arm64 .
          sha256sum comfyui-manager-linux-arm64 > comfyui-manager-linux-arm64.sha256
          tar -czf comfyui-manager-linux-arm64.tar.gz \
            comfyui-manager-linux-arm64 \
            comfyui-manager-linux-arm64.sha256 \
            config.example.json \
            start.sh \
            install-systemd.sh \
            comfyui-manager.service \
            README.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          tag="${{ steps.meta.outputs.tag }}"
          notes="$(cat <<'EOF'
Lightweight local-only ComfyUI manager backend for DGX Spark / Ubuntu aarch64.

Includes:
- Linux arm64 single binary
- default config example
- startup and user-level systemd scripts
- SHA256 checksum
EOF
)"
          gh release create "$tag" \
            comfyui-manager-linux-arm64.tar.gz \
            comfyui-manager-linux-arm64.sha256 \
            --title "$tag" \
            --notes "$notes"
